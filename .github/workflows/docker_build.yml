name: Nightly container

on:
  schedule:
    # Off the hour to avoid the busiest scheduler window; always UTC.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-container
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/viseshrp/firezone-plus
  BASE_VERSION: 7.2.27-plus.1

jobs:
  prepare:
    if: github.repository == 'viseshrp/firezone-plus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      created: ${{ steps.metadata.outputs.created }}
    steps:
      - name: Record the main revision and build identity
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$BASE_VERSION.nightly.$stamp.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT+${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$stamp-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    name: Build and smoke test (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Audit locked native dependencies
        run: python3 scripts/audit-native-dependencies.py

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.prod
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ needs.prepare.outputs.revision }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test the published platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.machine }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(docker run --rm --entrypoint /app/bin/firezone "$IMAGE@$DIGEST" version)"
          test "$actual_version" = "firezone $EXPECTED_VERSION"
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")"
          test "$actual_revision" = "$EXPECTED_REVISION"
          docker run --rm --entrypoint /bin/cat "$IMAGE@$DIGEST" \
            /usr/share/firezone-plus/wireguard-native-Cargo.lock > "$RUNNER_TEMP/native-Cargo.lock"
          cmp vendor/security/wireguardex/native/wireguard_nif/Cargo.lock "$RUNNER_TEMP/native-Cargo.lock"
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec \
            'zlib_version="$(apk info -v | sed -n "s/^zlib-//p")"; test -n "$zlib_version";
             test "$(apk version -t "$zlib_version" 1.3.2-r1)" != "<"'
          docker run --rm --cap-add NET_ADMIN \
            -v "$PWD/scripts/test-native-wireguard.exs:/tmp/native-check.exs:ro" \
            --entrypoint /usr/local/bin/elixir "$IMAGE@$DIGEST" \
            -pa '/app/lib/*/ebin' /tmp/native-check.exs
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec \
            'test -x /app/bin/server; command -v nft >/dev/null; test "$(uname -m)" = "$1";
             set -- /app/lib/cloak-*/ebin/Elixir.Cloak.Ciphers.AES.GCM.beam; test -f "$1";
             for beam in /app/lib/cloak-*/ebin/Elixir.Cloak.Ciphers.AES.CTR.beam /app/lib/cloak-*/ebin/Elixir.Cloak.Ciphers.Deprecated.AES.CTR.beam; do test ! -e "$beam"; done' \
            sh "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Export the verified platform digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish nightly manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified platform digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tags after both platforms pass
        env:
          NIGHTLY_TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create \
            --tag "$IMAGE:nightly" \
            --tag "$IMAGE:$NIGHTLY_TAG" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:nightly" --raw > "$RUNNER_TEMP/nightly.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/nightly.json"
          {
            echo "Image: $IMAGE:nightly"
            echo "Build tag: $IMAGE:$NIGHTLY_TAG"
            echo "Source revision: $REVISION"
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
